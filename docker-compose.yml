services:
  bluephishproxy:
    build: .
    ports:
      - "${BPP_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - bpp-data:/app/data
      - bpp-logs:/app/analytics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v2/metrics/usr"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bpp-data:
  bpp-logs:
