services:
  bluephishproxy:
    build: .
    container_name: bluephishproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - bpp-data:/app/data
      - ./certs:/app/certs:ro
    env_file:
      - .env
    environment:
      - BPP_DATABASE=/app/data/bluephishproxy.db
      - BPP_BEHIND_CLOUDFLARE=true
      - BPP_TRUSTED_PROXIES=2
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bpp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      bluephishproxy:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  bpp-data:
    driver: local
